name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: unit tests
        run: PYTHONPATH=src python -m pytest tests -q
      - name: the recorded demo runs with no key and no network
        run: QLOO_MODE=replay ADVANCE_NO_LLM=1 PYTHONPATH=src python -m advance "Phoebe Bridgers in Chicago"
